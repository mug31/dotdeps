# Config Hyprland contoh (ada error yang disengaja)
$terminal = kitty

source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/keybinds.conf
source = ~/.config/hypr/theme.conf        # sengaja tidak ada -> BROKEN LINK

exec-once = waybar
exec-once = [workspace 2 silent] browser-fiktif   # program tidak terinstall
