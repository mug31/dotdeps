# Contoh konfigurasi Hyprland untuk demo dotdeps
$terminal = kitty
$menu     = wofi --show drun
$browser  = browser-fiktif

source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/keybinds.conf
source = ~/.config/hypr/theme.conf     # sengaja tidak ada -> BROKEN LINK
source = ./conf.d/*.conf               # glob, diekspansi ke semua file

exec-once = uwsm app -- waybar
exec-once = [workspace 2 silent] $browser
exec-once = swww-daemon && swww img ~/Pictures/wall.png
exec-once = sh -c "sleep 2 && notify-send 'Selamat datang'"
