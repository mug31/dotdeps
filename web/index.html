<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>dotdeps</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <!-- 1. Pilih sumber lalu scan -->
    <section class="hero">
      <p class="brand"><span class="logo">◆</span> dotdeps</p>
      <h1>Cek dependensi dotfiles</h1>
      <p class="lead">Temukan file config yang hilang, program yang belum terinstall, dan include melingkar.</p>

      <div class="seg" role="tablist" aria-label="Sumber dotfiles">
        <button type="button" role="tab" data-sumber="laptop" aria-selected="true">Laptop ini</button>
        <button type="button" role="tab" data-sumber="contoh" aria-selected="false">Contoh</button>
      </div>

      <form class="scan-row" id="scan-form">
        <p class="source-note" id="note">Memindai <code>~/.config</code> di laptop ini.</p>
        <button type="submit" class="primary" id="btn-scan">Scan</button>
      </form>
      <p class="status" id="status" role="status"></p>
    </section>

    <!-- 2. Hasil -->
    <section class="result hidden" id="result">
      <div class="verdict" id="verdict"></div>

      <div class="toolbar">
        <input type="search" id="search" placeholder="Cari file atau program…" spellcheck="false">
        <label class="toggle"><input type="checkbox" id="only-bad"> Hanya masalah</label>
        <button type="button" id="btn-fit">Tampilkan semua</button>
      </div>

      <div class="split">
        <!-- daftar dependensi, tiap baris terhubung ke node di graph -->
        <div class="list" id="list"></div>

        <div class="graph-box">
          <div id="cy" aria-label="Graph dependensi"></div>
          <div class="legend">
            <span><i class="sw sw-file"></i>file</span>
            <span><i class="sw sw-bin"></i>program</span>
            <span><i class="sw sw-bad"></i>masalah</span>
            <span><i class="sw sw-cycle"></i>melingkar</span>
            <span><i class="sw sw-ext"></i>di luar ~/.config</span>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="vendor/cytoscape.min.js"></script>
  <script src="vendor/dagre.min.js"></script>
  <script src="vendor/cytoscape-dagre.js"></script>
  <script src="app.js"></script>
</body>
</html>
